name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  console:
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  bridge-jvm:
    name: bridge-jvm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/dji_mini3/pilot-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: adapters/dji_mini3/pilot-app/gradle/wrapper/gradle-wrapper.properties
      # Pure-JVM modules only; the Android module is skipped by settings.gradle.kts when no SDK
      # location resolves, so no Android SDK is installed here.
      - run: ./gradlew --no-daemon :bridge-core:test :bench:test :bridge-node:test :bridge-publish:test
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv run python -m tools.check_phone_observation adapters/dji_mini3/pilot-app/bridge-node/build/interop/phone-observation.json
        working-directory: .
      - run: uv run python -m tools.check_phone_control_heartbeat --android-project adapters/dji_mini3/pilot-app
        working-directory: .

  android-unit:
    name: android-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: adapters/dji_mini3/pilot-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: adapters/dji_mini3/pilot-app/gradle/wrapper/gradle-wrapper.properties
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew --no-daemon :app:testFakeDebugUnitTest :app:testProbeDebugUnitTest
      # Build both native-library sets without a registration credential. APKs stay local
      # to the runner; successful binary checks do not qualify physical flight.
      - run: ./gradlew --no-daemon -PDJI_API_KEY= -PsweepSupervisedVertical=false :app:assembleFakeDebug :app:assembleProbeDebug
      - run: |
          python3 tools/check_apk_alignment.py app/build/outputs/apk/fake/debug/app-fake-debug.apk
          python3 tools/check_apk_alignment.py app/build/outputs/apk/probe/debug/app-probe-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/fake/debug/app-fake-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/probe/debug/app-probe-debug.apk

  m14-browser:
    name: m14 browser path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: console/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
        working-directory: console
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: console
      - run: pnpm test:m14-browser
        working-directory: console
