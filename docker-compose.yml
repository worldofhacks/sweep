# Ground-station services (PRD section 7.5). Start with: docker compose up
#
# relay      arrives in M1 once relay/ has an app and a Dockerfile.
# perception arrives in M3.
# No restart policy: a bad config makes `just media` exit with the error instead of looping.
name: sweep

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    container_name: sweep-mediamtx
    ports:
      - "8554:8554"                 # RTSP ingest from drones and cameras
      - "8000-8001:8000-8001/udp"   # RTSP RTP/RTCP for publishers that negotiate UDP (ffmpeg's default)
      - "8889:8889"                 # WebRTC (WHIP publish, WHEP play) for the console
      - "8189:8189/udp"             # WebRTC ICE
      - "8888:8888"                 # HLS
    environment:
      # MediaMTX advertises its own (container) address as its ICE candidate; a WHIP publisher
      # or WHEP player on another machine needs the ground station's LAN address instead.
      # Export SWEEP_MEDIA_HOST (or put it in .env) before `docker compose up`, then recreate
      # the container to apply it; the loopback default keeps browsers on this host working.
      - MTX_WEBRTCADDITIONALHOSTS=${SWEEP_MEDIA_HOST:-127.0.0.1}
      # The committed hash has no known plaintext and keeps every account locked when a
      # value is absent. Publisher passwords are media-only HMAC derivatives documented
      # in media/README.md; never put a relay/control token here directly.
      - MTX_AUTHINTERNALUSERS_0_PASS=${SWEEP_MEDIA_DRONE1_PASSWORD:-sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76}
      - MTX_AUTHINTERNALUSERS_1_PASS=${SWEEP_MEDIA_DRONE2_PASSWORD:-sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76}
      - MTX_AUTHINTERNALUSERS_2_PASS=${SWEEP_MEDIA_DRONE3_PASSWORD:-sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76}
      - MTX_AUTHINTERNALUSERS_3_PASS=${SWEEP_MEDIA_DRONE4_PASSWORD:-sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76}
      - MTX_AUTHINTERNALUSERS_4_USER=${SWEEP_MEDIA_READ_USERNAME:-sweep-reader}
      - MTX_AUTHINTERNALUSERS_4_PASS=${SWEEP_MEDIA_READ_PASSWORD:-sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76}
    volumes:
      # Edits to this file need `docker compose restart mediamtx`; the bind mount does not hot-reload.
      - ./media/mediamtx.yml:/mediamtx.yml:ro
      # M3: add ./recordings:/recordings and set recordPath in media/mediamtx.yml.
