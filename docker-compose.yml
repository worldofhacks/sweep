# Ground-station services (PRD section 7.5). Start with: docker compose up
#
# relay      arrives in M1 once relay/ has an app and a Dockerfile.
# perception arrives in M3.
# No restart policy: a bad config makes `just media` exit with the error instead of looping.
name: sweep

services:
  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    container_name: sweep-mediamtx
    ports:
      - "8554:8554"                 # RTSP ingest from drones and cameras
      - "127.0.0.1:8889:8889"       # local WHEP playback for the console
      - "127.0.0.1:8189:8189/udp"   # local WebRTC ICE
      - "127.0.0.1:8888:8888"       # local low-latency HLS fallback
      - "127.0.0.1:9997:9997"       # local readiness and recording API
      - "127.0.0.1:9998:9998"       # local Prometheus metrics
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_1:?Set SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_1}
      MTX_AUTHINTERNALUSERS_1_PASS: ${SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_2:?Set SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_2}
      MTX_AUTHINTERNALUSERS_2_PASS: ${SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_3:?Set SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_3}
      MTX_AUTHINTERNALUSERS_3_PASS: ${SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_4:?Set SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_4}
      MTX_AUTHINTERNALUSERS_4_PASS: ${SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_5:?Set SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_5}
      MTX_AUTHINTERNALUSERS_5_PASS: ${SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_6:?Set SWEEP_MEDIA_PUBLISH_PASSWORD_DRONE_6}
      MTX_AUTHINTERNALUSERS_6_PASS: ${SWEEP_MEDIA_READ_PASSWORD:?Set SWEEP_MEDIA_READ_PASSWORD}
      MTX_AUTHINTERNALUSERS_7_PASS: ${SWEEP_MEDIA_ADMIN_PASSWORD:?Set SWEEP_MEDIA_ADMIN_PASSWORD}
      MTX_WEBRTCADDITIONALHOSTS: ${SWEEP_MEDIA_WEBRTC_HOSTS:-127.0.0.1}
      MTX_WEBRTCALLOWORIGINS: ${SWEEP_CONSOLE_ORIGIN:-http://localhost:5173}
      MTX_HLSALLOWORIGINS: ${SWEEP_CONSOLE_ORIGIN:-http://localhost:5173}
      MTX_PATHDEFAULTS_RECORDSEGMENTDURATION: ${SWEEP_MEDIA_RECORD_SEGMENT_DURATION:-5s}
      MTX_PATHDEFAULTS_RECORDDELETEAFTER: ${SWEEP_MEDIA_RECORD_RETENTION:-24h}
    volumes:
      - ./media/mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
