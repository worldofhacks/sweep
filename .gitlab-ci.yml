# Mirror of .github/workflows/ci.yml for the labs.gauntletai.com copy.
# Runs on merge requests and on the default branch, like the GitHub workflow.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [test]

.ci-job:
  stage: test
  interruptible: true
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

python:
  extends: .ci-job
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    UV_LINK_MODE: copy
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest

console:
  extends: .ci-job
  image: node:24-bookworm-slim
  before_script:
    # Same pnpm as console/package.json's packageManager, so the two CIs cannot drift.
    - npm install -g "pnpm@$(node -p "require('./console/package.json').packageManager.split('@')[1]")"
  script:
    - cd console
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build

bridge-jvm:
  extends: .ci-job
  image: eclipse-temurin:17-jdk
  timeout: 15m
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  cache:
    key: bridge-jvm-gradle
    paths:
      - .gradle-home/caches
      - .gradle-home/wrapper
  script:
    # Pure-JVM modules only; settings.gradle.kts skips the Android module without an SDK.
    - cd adapters/dji_mini3/pilot-app
    - ./gradlew --no-daemon :bridge-core:test :bridge-node:test :bridge-publish:test :bench:test
