[project]
name = "sweep"
version = "0.0.1"
description = "One person creates AI-generated room worlds and commands four indoor DJI Mini 3 drones through a live shared intent engine."
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=15,<17",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langfuse>=4.15,<5",
  "numpy>=2,<3",
  "opencv-python-headless>=4.13,<5",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests", "relay", "planner", "arbiter", "adapters", "perception", "language", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["console", "datasets", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
