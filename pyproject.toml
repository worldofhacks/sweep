[project]
name = "sweep"
version = "0.0.1"
description = "One person creates AI-generated room worlds and commands four indoor DJI Mini 3 drones through a live shared intent engine."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests", "relay", "planner", "arbiter", "adapters", "perception", "language", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["console", "datasets", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
