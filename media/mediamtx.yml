# MediaMTX configuration for Sweep (PRD section 5.7).
# Streams are named by drone id, f"drone{id}": publish to rtsp://<ground-station>:8554/drone1 ... drone6.
# The console plays them over WebRTC (WHEP) at http://<ground-station>:8889/<name>/whep
# and over HLS at http://<ground-station>:8888/<name>/index.m3u8 (the bare /<name>/ URL is the built-in player).
# Every parameter not listed here keeps the MediaMTX default.

logLevel: info

# Serve only what the console uses; every other protocol stays off.
rtsp: yes
webrtc: yes
hls: yes
rtmp: no
srt: no
moq: no

# Inside Docker, MediaMTX advertises its container IP as an ICE candidate. docker-compose.yml
# sets webrtcAdditionalHosts from SWEEP_MEDIA_HOST (the ground station's LAN IP) so phones
# publishing over WHIP and browsers playing over WHEP from other machines can reach it.
# webrtcAdditionalHosts: []

# Recording is switched on in M3: pathDefaults.record plus a mounted recordings volume.

# Control API for the relay's per-aircraft video projection (relay/README.md, state
# fan-out `video`). The relay reads /v3/paths/get/drone{n}. docker-compose.yml publishes
# this listener on the ground station's loopback only, never on the LAN, and the
# sweep-api account below is the only principal allowed to call it.
api: yes
apiAddress: :9997

# Locked by default. docker-compose.yml replaces only these password hashes when the
# operator supplies the six media credentials in .env. Each aircraft may publish only
# its own path; the console reader may read/play back only drone1..drone4; the relay's
# API reader may only call the control API. There is no anonymous user, so a missing
# environment value fails closed instead of opening the LAN.
authMethod: internal
authInternalUsers:
  - user: drone1
    pass: sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76
    permissions:
      - action: publish
        path: drone1
  - user: drone2
    pass: sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76
    permissions:
      - action: publish
        path: drone2
  - user: drone3
    pass: sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76
    permissions:
      - action: publish
        path: drone3
  - user: drone4
    pass: sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76
    permissions:
      - action: publish
        path: drone4
  - user: sweep-reader
    pass: sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76
    permissions:
      - action: read
        path: ~^drone[1-4]$
      - action: playback
        path: ~^drone[1-4]$
  - user: sweep-api
    pass: sha256:aacd03b07c2bf6584162876d3591c9be0b9c5e7023c2a2e989fb51774e4afa76
    permissions:
      - action: api

paths:
  all_others:
