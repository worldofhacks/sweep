# Streams use drone1 through drone6. Start this configuration through Docker Compose so
# environment-backed credentials replace the disabled placeholder password hashes.

logLevel: info
logStructured: true

rtsp: yes
rtspTransports: [tcp]
rtspAuthMethods: [digest]
webrtc: yes
webrtcAllowOrigins: ["http://localhost:5173"]
hls: yes
hlsAllowOrigins: ["http://localhost:5173"]
hlsAlwaysRemux: yes
hlsVariant: lowLatency
rtmp: no
srt: no
moq: no

api: yes
metrics: yes

authMethod: internal
authInternalUsers:
  - user: sweep-publisher-1
    pass: sha256:disabled
    permissions:
      - action: publish
        path: drone1
  - user: sweep-publisher-2
    pass: sha256:disabled
    permissions:
      - action: publish
        path: drone2
  - user: sweep-publisher-3
    pass: sha256:disabled
    permissions:
      - action: publish
        path: drone3
  - user: sweep-publisher-4
    pass: sha256:disabled
    permissions:
      - action: publish
        path: drone4
  - user: sweep-publisher-5
    pass: sha256:disabled
    permissions:
      - action: publish
        path: drone5
  - user: sweep-publisher-6
    pass: sha256:disabled
    permissions:
      - action: publish
        path: drone6
  - user: sweep-reader
    pass: sha256:disabled
    permissions:
      - action: read
        path: ~^drone[1-6]$
  - user: sweep-admin
    pass: sha256:disabled
    permissions:
      - action: api
      - action: metrics

pathDefaults:
  overridePublisher: no
  record: yes
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 5s
  recordDeleteAfter: 24h

paths:
  ~^drone[1-6]$: {}
