<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5ed" />
    <meta
      name="description"
      content="Sweep is building a shared memory of real places. Gather captures, preserve their context, and bring more perspectives into the story."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sweep — A place is more than a picture.</title>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="#" aria-label="Sweep home"
        ><svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 3 3 8l9 5 9-5-9-5ZM3 12l9 5 9-5M3 16l9 5 9-5" /></svg
        ><span>sweep</span></a
      >
      <nav aria-label="Main navigation">
        <a class="workspace-link" href="/"
          >Open workspace <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">A shared memory of the real world</p>
        <h1 id="hero-title">A place is more <br />than a <em>picture.</em></h1>
        <p class="hero-description">
          The people. The sounds. The way the light fell.<br
            class="desktop-break"
          />
          We’re building Sweep to keep those pieces together.
        </p>
        <div class="hero-actions">
          <a class="button primary" href="#world"
            >See the world <span aria-hidden="true">↓</span></a
          ><a class="text-link" href="/"
            >Try the workspace <span aria-hidden="true">↗</span></a
          >
        </div>
        <figure class="hero-world" id="world">
          <img
            src="/landing/austin-memory-world.webp"
            width="1536"
            height="1024"
            fetchpriority="high"
            alt="An illustrated Austin neighborhood, creek and picnic beneath a glass sky, resting on a floating limestone island."
          />
          <figcaption>A little world, held together.</figcaption>
        </figure>
      </section>
    </main>
    <script type="module" src="/src/landing/main.ts"></script>
  </body>
</html>
